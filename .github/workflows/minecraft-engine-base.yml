name: Mikael Launcher Plus engine validation

on:
  # Source changes validate the real engine integration; this never packages an APK.
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/mikael/launcherplus/**'
      - '.github/workflows/minecraft-engine-base.yml'
  # Manual validation is the default. APK packaging requires explicitly selecting "build".
  workflow_dispatch:
    inputs:
      mode:
        description: "Etapa: validar a integração sem APK ou compilar APK (somente quando autorizado)"
        required: true
        type: choice
        options:
          - validate
          - build
        default: validate

permissions:
  contents: read

concurrency:
  group: engine-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engine-base:
    name: Validate Mikael Launcher Plus engine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Mikael Launcher Plus
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Configure HTTPS for upstream submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Fetch upstream source at pinned revision
        run: |
          git clone --no-checkout https://github.com/AngelAuraMC/Amethyst-Android.git upstream/Amethyst-Android
          git -C upstream/Amethyst-Android checkout --detach 330c6eae3164df64bdc4828e946a9e62cc5169e4
          git -C upstream/Amethyst-Android submodule sync --recursive
          git -C upstream/Amethyst-Android submodule update --init --recursive
          git -C upstream/Amethyst-Android rev-parse HEAD | tee upstream-commit.txt
          test "$(cat upstream-commit.txt)" = "330c6eae3164df64bdc4828e946a9e62cc5169e4"

      - name: Adapt compile SDK to currently published Android platform
        working-directory: upstream/Amethyst-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app_pojavlauncher/build.gradle")
          content = path.read_text()
          if "compileSdk = 37" not in content:
              raise SystemExit("Expected pinned upstream compileSdk declaration was not found")
          replacement = """compileSdk {
              version = release(36) {
                  it.minorApiLevel = 1
              }
          }"""
          path.write_text(content.replace("compileSdk = 37", replacement, 1))
          PY

      - name: Apply development app label
        working-directory: upstream/Amethyst-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app_pojavlauncher/build.gradle")
          content = path.read_text()
          replacements = {
              'resValue "string", "app_name", "Amethyst (Debug)"':
                  'resValue "string", "app_name", "Mikael Launcher Plus (Engine Test)"',
              'resValue "string", "app_short_name", "Amethyst (Debug)"':
                  'resValue "string", "app_short_name", "Mikael Launcher Plus"',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit("Expected debug app label not found: " + old)
              content = content.replace(old, new, 1)
          path.write_text(content)
          PY

      - name: Integrate Mikael UI and instance tools into the engine app
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/app/src/main/java/com/mikael/launcherplus"
          destination_dir="$GITHUB_WORKSPACE/upstream/Amethyst-Android/app_pojavlauncher/src/main/java/com/mikael/launcherplus"
          test -f "$source_dir/MainActivity.java"
          test -f "$source_dir/InstanceManager.java"
          test -f "$source_dir/InstanceModManager.java"
          test -f "$source_dir/VersionArtifactInstaller.java"
          test -f "$source_dir/MinecraftEngineBridge.java"
          test -f "$source_dir/ModCompatibilityChecker.java"
          test -f "$source_dir/DiagnosticLogManager.java"
          test -f "$source_dir/InstanceReadinessChecker.java"
          test -f "$source_dir/VanillaAssetInstaller.java"
          test -f "$source_dir/VanillaLibraryInstaller.java"
          mkdir -p "$destination_dir"
          cp "$source_dir/MainActivity.java" "$source_dir/InstanceManager.java" \
             "$source_dir/InstanceModManager.java" "$source_dir/VersionArtifactInstaller.java" \
             "$source_dir/MinecraftEngineBridge.java" "$source_dir/ModCompatibilityChecker.java" \
             "$source_dir/DiagnosticLogManager.java" "$source_dir/InstanceReadinessChecker.java" \
             "$source_dir/VanillaAssetInstaller.java" "$source_dir/VanillaLibraryInstaller.java" "$destination_dir/"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/AndroidManifest.xml")
          content = path.read_text()
          if 'android:name="com.mikael.launcherplus.MainActivity"' in content:
              raise SystemExit("Mikael launcher activity already exists; refusing to duplicate it")

          blocks = list(re.finditer(r'        <activity\b.*?</activity>', content, re.DOTALL))
          matches = []
          for block in blocks:
              value = block.group(0)
              if ('android:name=".TestStorageActivity"' in value
                      and 'android.intent.action.MAIN' in value
                      and 'android.intent.category.LAUNCHER' in value):
                  matches.append(block)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one TestStorageActivity launcher block; found " + str(len(matches)))

          launcher_block = """        <activity
                      android:name=".TestStorageActivity"
                      android:exported="false"
                      android:label="@string/app_short_name"
                      android:launchMode="singleTop" />
                  <activity
                      android:name="com.mikael.launcherplus.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>"""
          block = matches[0]
          path.write_text(content[:block.start()] + launcher_block + content[block.end():])
          PY
          grep -q 'android:name="com.mikael.launcherplus.MainActivity"' \
            upstream/Amethyst-Android/app_pojavlauncher/src/main/AndroidManifest.xml

          # Rename Android-visible labels so the installed app is branded as Mikael Launcher Plus.
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest_path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          manifest, icon_count = re.subn(r'android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/mikael_launcher_plus_icon"', manifest, count=1)
          manifest, round_icon_count = re.subn(r'android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/mikael_launcher_plus_icon"', manifest, count=1)
          if icon_count != 1 or round_icon_count != 1:
              raise SystemExit("Could not replace the visible launcher icon references")
          manifest_path.write_text(manifest)

          icon_path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/res/drawable/mikael_launcher_plus_icon.xml")
          icon_path.parent.mkdir(parents=True, exist_ok=True)
          icon_path.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#080D0B" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#00D68F" android:pathData="M18,78 L18,30 L31,30 L54,56 L77,30 L90,30 L90,78 L76,78 L76,49 L54,73 L32,49 L32,78 Z" />
              <path android:fillColor="#F0F7F3" android:pathData="M54,35 L64,45 L54,55 L44,45 Z" />
          </vector>
          """)
          strings_path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/res/values/strings.xml")
          value = strings_path.read_text()
          for name, text_value in [
              ("app_name", "Mikael Launcher Plus"),
              ("app_short_name", "Mikael Launcher Plus"),
              ("error_fatal", "Mikael Launcher Plus encontrou um erro inesperado")
          ]:
              pattern = r'(<string\s+name="' + re.escape(name) + r'"[^>]*>).*?(</string>)'
              value, count = re.subn(pattern, r'\g<1>' + text_value + r'\g<2>', value, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit("Could not replace visible string: " + name)
          strings_path.write_text(value)

          tools_path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch/Tools.java")
          tools_content = tools_path.read_text()
          old_app_name = 'public static String APP_NAME = "Amethyst";'
          if tools_content.count(old_app_name) != 1:
              raise SystemExit("Could not replace the engine's visible application name")
          tools_path.write_text(tools_content.replace(
              old_app_name,
              'public static String APP_NAME = "Mikael Launcher Plus";',
              1
          ))
          PY

          # Forward the selected version through the engine's required storage bootstrap.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch")
          extra = "com.mikael.launcherplus.extra.REQUESTED_VERSION"
          loader_extra = "com.mikael.launcherplus.extra.REQUESTED_LOADER"

          bootstrap = root / "TestStorageActivity.java"
          text = bootstrap.read_text()
          old = "Intent intent =  new Intent(this, LauncherActivity.class);"
          new = (
              "Intent intent = new Intent(this, LauncherActivity.class);\n"
              "        String requestedVersion = getIntent().getStringExtra(\"" + extra + "\");\n"
              "        if (requestedVersion != null && requestedVersion.matches(\"[A-Za-z0-9._-]{1,100}\")) {\n"
              "            intent.putExtra(\"" + extra + "\", requestedVersion);\n"
              "        }\n"
              "        String requestedLoader = getIntent().getStringExtra(\"" + loader_extra + "\");\n"
              "        if (\"Vanilla\".equals(requestedLoader) || \"Forge\".equals(requestedLoader) || \"Fabric\".equals(requestedLoader) || \"Quilt\".equals(requestedLoader) || \"NeoForge\".equals(requestedLoader) || \"OptiFine\".equals(requestedLoader) || \"Forge + OptiFine\".equals(requestedLoader)) {\n"
              "            intent.putExtra(\"" + loader_extra + "\", requestedLoader);\n"
              "        }"
          )
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one TestStorageActivity launcher handoff")
          bootstrap.write_text(text.replace(old, new, 1))

          launcher = root / "LauncherActivity.java"
          text = launcher.read_text()
          text = text.replace(
              "import android.os.Bundle;\\n",
              "import android.os.Bundle;\\nimport android.os.Handler;\\nimport android.os.Looper;\\n",
              1
          )
          field_anchor = "    private mcAccountSpinner mAccountSpinner;"
          fields = (
              "    private String mikaelRequestedVersion;\n"
              "    private String mikaelRequestedLoader;\n"
              "    private boolean mikaelLaunchScheduled;\n"
              "    private int mikaelLaunchAttempts;\n"
              "    private boolean mikaelLoaderNavigationScheduled;\n"
              "    private int mikaelLoaderNavigationAttempts;\n"
              "    private boolean mikaelPendingInstallResumeScheduled;\n"
              "    private int mikaelPendingInstallAttempts;\n"
              + field_anchor
          )
          if text.count(field_anchor) != 1:
              raise SystemExit("Expected exactly one launcher account-spinner field")
          text = text.replace(field_anchor, fields, 1)

          on_create = (
              "        super.onCreate(savedInstanceState);\n"
              "        setContentView(R.layout.activity_pojav_launcher);"
          )
          on_create_replacement = (
              "        super.onCreate(savedInstanceState);\n"
              "        mikaelRequestedVersion = getIntent().getStringExtra(\"" + extra + "\");\n"
              "        mikaelRequestedLoader = getIntent().getStringExtra(\"" + loader_extra + "\");\n"
              "        setContentView(R.layout.activity_pojav_launcher);"
          )
          if text.count(on_create) != 1:
              raise SystemExit("Expected exactly one LauncherActivity onCreate setup")
          text = text.replace(on_create, on_create_replacement, 1)

          # Replace the Amethyst home fragment with an empty engine host for Mikael UI requests.
          menu_lines = [
              '        if(fragmentManager.getBackStackEntryCount() < 1) {',
              '            // Manually add the first fragment to the backstack to get easily back to it',
              '            // There must be a better way to handle the root though...',
              '            // (artDev: No, there is not. I\'ve spent days researching this for another unrelated project.)',
              '            fragmentManager.beginTransaction()',
              '                    .setReorderingAllowed(true)',
              '                    .addToBackStack("ROOT")',
              '                    .add(R.id.container_fragment, MainMenuFragment.class, null, "ROOT").commit();',
              '        }',
          ]
          menu_block = "\n".join(menu_lines)
          engine_lines = [
              '        if (fragmentManager.getBackStackEntryCount() < 1) {',
              '            fragmentManager.beginTransaction()',
              '                    .setReorderingAllowed(true)',
              '                    .addToBackStack("ROOT")',
              '                    .add(R.id.container_fragment,',
              '                            (mikaelRequestedVersion != null || mikaelRequestedLoader != null)',
              '                                    ? Fragment.class : MainMenuFragment.class,',
              '                            null, "ROOT").commit();',
              '        }',
          ]
          engine_block = "\n".join(engine_lines)
          if text.count(menu_block) != 1:
              raise SystemExit("Expected exactly one native launcher main-menu fragment block")
          text = text.replace(menu_block, engine_block, 1)

          resume = (
              "    protected void onResume() {\n"
              "        super.onResume();\n"
              "        ContextExecutor.setActivity(this);\n"
              "        mInstallTracker.attach();\n"
              "    }"
          )
          resume_replacement = (
              "    protected void onResume() {\n"
              "        super.onResume();\n"
              "        ContextExecutor.setActivity(this);\n"
              "        mInstallTracker.attach();\n"
              "        maybeOpenMikaelRequestedLoaderInstaller();\n"
              "        maybeResumeMikaelPendingInstaller();\n"
              "        maybeLaunchMikaelRequestedVersion();\n"
              "    }"
          )
          if text.count(resume) != 1:
              raise SystemExit("Expected exactly one LauncherActivity onResume")
          text = text.replace(resume, resume_replacement, 1)

          # Remove Amethyst's account/settings header while its embedded engine is handling a Mikael request.
          bind_anchor = "        bindViews();\n        checkNotificationPermission();"
          bind_replacement = (
              "        bindViews();\n"
              "        if (mikaelRequestedVersion != null || mikaelRequestedLoader != null) {\n"
              "            if (mAccountSpinner != null) mAccountSpinner.setVisibility(View.GONE);\n"
              "            if (mSettingsButton != null) mSettingsButton.setVisibility(View.GONE);\n"
              "            View engineProgress = findViewById(R.id.progress_layout);\n"
              "            if (engineProgress != null) engineProgress.setVisibility(View.GONE);\n"
              "            // Mikael's UI owns the flow: keep the engine host invisible and unbranded.\n"
              "            View engineContainer = findViewById(R.id.container_fragment);\n"
              "            if (engineContainer != null) engineContainer.setVisibility(View.INVISIBLE);\n"
              "            getWindow().setBackgroundDrawable(new android.graphics.drawable.ColorDrawable(0xFF080D0B));\n"
              "            getWindow().setStatusBarColor(0xFF080D0B);\n"
              "            getWindow().setNavigationBarColor(0xFF080D0B);\n"
              "            if (getSupportActionBar() != null) getSupportActionBar().hide();\n"
              "        }\n"
              "        checkNotificationPermission();"
          )
          if text.count(bind_anchor) != 1:
              raise SystemExit("Expected exactly one launcher view binding point")
          text = text.replace(bind_anchor, bind_replacement, 1)

          method_anchor = "    @Override\n    protected void onResume() {"
          method = (
              "    private void maybeLaunchMikaelRequestedVersion() {\n"
              "        if (mikaelRequestedVersion == null || mikaelLaunchScheduled) return;\n"
              "        mikaelLaunchScheduled = true;\n"
              "        new Handler(Looper.getMainLooper()).postDelayed(() -> {\n"
              "            mikaelLaunchScheduled = false;\n"
              "            if (mikaelRequestedVersion == null || isFinishing()) return;\n"
              "            if (LauncherProfiles.mainProfileJson == null\n"
              "                    || LauncherProfiles.mainProfileJson.profiles == null\n"
              "                    || LauncherProfiles.mainProfileJson.profiles.isEmpty()) {\n"
              "                if (++mikaelLaunchAttempts < 20) {\n"
              "                    maybeLaunchMikaelRequestedVersion();\n"
              "                } else {\n"
              "                    Toast.makeText(this, \"O perfil do Minecraft não ficou pronto. Volte à aba Versões e tente novamente.\", Toast.LENGTH_LONG).show();\n"
              "                    mikaelRequestedVersion = null;\n"
              "                    getIntent().removeExtra(\"" + extra + "\");\n"
              "                }\n"
              "                return;\n"
              "            }\n"
              "            String selectedProfile = LauncherPreferences.DEFAULT_PREF.getString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, \"\");\n"
              "            if (!LauncherProfiles.mainProfileJson.profiles.containsKey(selectedProfile)) {\n"
              "                selectedProfile = LauncherProfiles.mainProfileJson.profiles.keySet().iterator().next();\n"
              "                LauncherPreferences.DEFAULT_PREF.edit().putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, selectedProfile).apply();\n"
              "            }\n"
              "            MinecraftProfile profile = LauncherProfiles.mainProfileJson.profiles.get(selectedProfile);\n"
              "            if (profile == null) {\n"
              "                Toast.makeText(this, \"Não foi possível selecionar o perfil do Minecraft.\", Toast.LENGTH_LONG).show();\n"
              "                mikaelRequestedVersion = null;\n"
              "                getIntent().removeExtra(\"" + extra + "\");\n"
              "                return;\n"
              "            }\n"
              "            profile.lastVersionId = mikaelRequestedVersion;\n"
              "            LauncherProfiles.mainProfileJson.profiles.put(selectedProfile, profile);\n"
              "            LauncherProfiles.write();\n"
              "            mikaelRequestedVersion = null;\n"
              "            getIntent().removeExtra(\"" + extra + "\");\n"
              "            ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true);\n"
              "        }, 900);\n"
              "    }\n\n"
              + method_anchor
          )
          if text.count(method_anchor) != 1:
              raise SystemExit("Expected exactly one LauncherActivity lifecycle insertion point")
          text = text.replace(method_anchor, method, 1)
          launcher.write_text(text)
          PY

      - name: Replace Amethyst installer screens with Mikael install controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          root = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch")
          launcher_path = root / "LauncherActivity.java"
          source = launcher_path.read_text()
          
          extra_imports = [
              "import android.widget.LinearLayout;",
              "import android.widget.ProgressBar;",
              "import android.widget.TextView;",
              "import androidx.appcompat.app.AlertDialog;",
              "import net.kdt.pojavlaunch.modloaders.FabricVersion;",
              "import net.kdt.pojavlaunch.modloaders.FabriclikeDownloadTask;",
              "import net.kdt.pojavlaunch.modloaders.FabriclikeUtils;",
              "import net.kdt.pojavlaunch.modloaders.ForgeDownloadTask;",
              "import net.kdt.pojavlaunch.modloaders.ForgeUtils;",
              "import net.kdt.pojavlaunch.modloaders.ModloaderDownloadListener;",
              "import net.kdt.pojavlaunch.modloaders.NeoForgeDownloadTask;",
              "import net.kdt.pojavlaunch.modloaders.OptiFineDownloadTask;",
              "import net.kdt.pojavlaunch.modloaders.OptiFineUtils;",
              "import java.io.FileInputStream;",
              "import java.io.FileOutputStream;",
              "import java.io.File;",
              "import java.io.IOException;",
              "import java.util.List;"
          ]
          package_end = source.find("\n")
          missing_imports = [item for item in extra_imports if item not in source]
          if missing_imports:
              source = source[:package_end + 1] + "\n" + "\n".join(missing_imports) + "\n" + source[package_end + 1:]
          
          field_anchor = "    private mcAccountSpinner mAccountSpinner;"
          if source.count(field_anchor) != 1:
              raise SystemExit("Expected exactly one engine account-spinner field")
          if "private AlertDialog mikaelInstallProgressDialog;" not in source:
              source = source.replace(field_anchor, "    private AlertDialog mikaelInstallProgressDialog;\n" + field_anchor, 1)
          
          guard_old = "    private void maybeLaunchMikaelRequestedVersion() {\n        if (mikaelRequestedVersion == null || mikaelLaunchScheduled) return;"
          guard_new = "    private void maybeLaunchMikaelRequestedVersion() {\n        if (mikaelRequestedLoader != null && !\"Vanilla\".equals(mikaelRequestedLoader)) return;\n        if (mikaelRequestedVersion == null || mikaelLaunchScheduled) return;"
          if source.count(guard_old) != 1:
              raise SystemExit("Expected the vanilla launch guard insertion point")
          source = source.replace(guard_old, guard_new, 1)
          
          method_anchor = '    private void maybeLaunchMikaelRequestedVersion() {'
          if source.count(method_anchor) != 1:
              raise SystemExit("Expected exactly one version launch method")
          methods = r'''    private void maybeOpenMikaelRequestedLoaderInstaller() {
                  if (mikaelRequestedLoader == null || mikaelLoaderNavigationScheduled || isFinishing()) return;
                  if ("Vanilla".equals(mikaelRequestedLoader)) {
                      mikaelRequestedLoader = null;
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                      return;
                  }
                  mikaelLoaderNavigationScheduled = true;
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      mikaelLoaderNavigationScheduled = false;
                      if (mikaelRequestedLoader == null || isFinishing()) return;
                      final String loader = mikaelRequestedLoader;
                      final String gameVersion = mikaelRequestedVersion;
                      mikaelRequestedLoader = null;
                      mikaelRequestedVersion = null;
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_VERSION");
                      if (gameVersion == null || !gameVersion.matches("[A-Za-z0-9._-]{1,100}")) {
                          showMikaelInstallError("A versão selecionada do Minecraft é inválida.", null);
                          return;
                      }
                      try { LauncherProfiles.load(); } catch (Exception ignored) { }
                      if ("Fabric".equals(loader) || "Quilt".equals(loader)) {
                          startMikaelFabriclikeInstall(loader, gameVersion);
                      } else if ("Forge".equals(loader)) {
                          startMikaelForgeInstall(gameVersion, false);
                      } else if ("Forge + OptiFine".equals(loader)) {
                          startMikaelForgeInstall(gameVersion, true);
                      } else if ("NeoForge".equals(loader)) {
                          startMikaelNeoForgeInstall(gameVersion);
                      } else if ("OptiFine".equals(loader)) {
                          startMikaelOptiFineInstall(gameVersion);
                      } else {
                          showMikaelInstallError("Esse modloader não está disponível no motor integrado.", null);
                      }
                  }, 650);
              }
          
              private void showMikaelInstallProgress(String message) {
                  runOnUiThread(() -> {
                      if (isFinishing()) return;
                      dismissMikaelInstallProgressInternal();
                      float density = getResources().getDisplayMetrics().density;
                      int padding = (int) (22 * density);
                      LinearLayout panel = new LinearLayout(this);
                      panel.setOrientation(LinearLayout.VERTICAL);
                      panel.setGravity(android.view.Gravity.CENTER_HORIZONTAL);
                      panel.setPadding(padding, padding, padding, padding);
                      panel.setBackgroundColor(0xFF101814);
          
                      TextView title = new TextView(this);
                      title.setText("MIKAEL LAUNCHER PLUS");
                      title.setTextColor(0xFF00D68F);
                      title.setTextSize(16);
                      title.setTypeface(android.graphics.Typeface.DEFAULT, android.graphics.Typeface.BOLD);
                      title.setGravity(android.view.Gravity.CENTER);
                      panel.addView(title, new LinearLayout.LayoutParams(-1, -2));
          
                      ProgressBar progress = new ProgressBar(this);
                      if (android.os.Build.VERSION.SDK_INT >= 21) {
                          progress.setIndeterminateTintList(android.content.res.ColorStateList.valueOf(0xFF00D68F));
                      }
                      LinearLayout.LayoutParams progressParams = new LinearLayout.LayoutParams(-2, -2);
                      progressParams.topMargin = (int) (18 * density);
                      progressParams.bottomMargin = (int) (14 * density);
                      panel.addView(progress, progressParams);
          
                      TextView detail = new TextView(this);
                      detail.setText(message);
                      detail.setTextColor(0xFFF0F7F3);
                      detail.setTextSize(14);
                      detail.setGravity(android.view.Gravity.CENTER);
                      panel.addView(detail, new LinearLayout.LayoutParams(-1, -2));
          
                      mikaelInstallProgressDialog = new AlertDialog.Builder(this)
                              .setView(panel)
                              .setCancelable(false)
                              .create();
                      mikaelInstallProgressDialog.show();
                      if (mikaelInstallProgressDialog.getWindow() != null) {
                          mikaelInstallProgressDialog.getWindow().setBackgroundDrawable(
                                  new android.graphics.drawable.ColorDrawable(0xFF101814));
                          mikaelInstallProgressDialog.getWindow().setDimAmount(0.65f);
                      }
                  });
              }
          
              private void dismissMikaelInstallProgress() {
                  if (Looper.myLooper() == Looper.getMainLooper()) {
                      dismissMikaelInstallProgressInternal();
                  } else {
                      runOnUiThread(this::dismissMikaelInstallProgressInternal);
                  }
              }
          
              private void dismissMikaelInstallProgressInternal() {
                  if (mikaelInstallProgressDialog != null) {
                      if (mikaelInstallProgressDialog.isShowing()) mikaelInstallProgressDialog.dismiss();
                      mikaelInstallProgressDialog = null;
                  }
              }
          
              private void showMikaelInstallError(String message, Exception cause) {
                  runOnUiThread(() -> {
                      dismissMikaelInstallProgressInternal();
                      String detail = message;
                      if (cause != null && cause.getMessage() != null && !cause.getMessage().trim().isEmpty()) {
                          detail += "\n\nDetalhes: " + cause.getMessage();
                      }
                      if (isFinishing()) {
                          Toast.makeText(getApplicationContext(), detail, Toast.LENGTH_LONG).show();
                          return;
                      }
                      new AlertDialog.Builder(this)
                              .setTitle("Mikael Launcher Plus")
                              .setMessage(detail)
                              .setPositiveButton("OK", (dialog, which) -> finish())
                              .setCancelable(false)
                              .show();
                  });
              }
          
              private void startMikaelFabriclikeInstall(String loader, String gameVersion) {
                  showMikaelInstallProgress("Baixando os metadados e preparando " + loader
                          + " para Minecraft " + gameVersion + "...");
                  PojavApplication.sExecutorService.execute(() -> {
                      try {
                          FabriclikeUtils utils = "Quilt".equals(loader)
                                  ? FabriclikeUtils.QUILT_UTILS : FabriclikeUtils.FABRIC_UTILS;
                          FabricVersion[] available = utils.downloadLoaderVersions(gameVersion);
                          if (available == null || available.length == 0) {
                              showMikaelInstallError(loader + " não publicou uma versão compatível com Minecraft "
                                      + gameVersion + ".", null);
                              return;
                          }
                          FabricVersion selected = null;
                          for (FabricVersion item : available) {
                              if (item != null && item.stable) {
                                  selected = item;
                                  break;
                              }
                          }
                          if (selected == null) {
                              for (FabricVersion item : available) {
                                  if (item != null && item.version != null && !item.version.trim().isEmpty()) {
                                      selected = item;
                                      break;
                                  }
                              }
                          }
                          if (selected == null) {
                              showMikaelInstallError("Não foi encontrada uma versão instalável de " + loader + ".", null);
                              return;
                          }
                          final String loaderVersion = selected.version;
                          ModloaderDownloadListener listener = new ModloaderDownloadListener() {
                              @Override
                              public void onDownloadFinished(File downloadedFile) {
                                  runOnUiThread(() -> finishMikaelProfileInstall(loader, gameVersion));
                              }
                              @Override
                              public void onDataNotAvailable() {
                                  showMikaelInstallError("Não foi possível baixar os arquivos de " + loader + ".", null);
                              }
                              @Override
                              public void onDownloadError(Exception e) {
                                  showMikaelInstallError("Falha ao instalar " + loader + ".", e);
                              }
                          };
                          new FabriclikeDownloadTask(listener, utils, gameVersion, loaderVersion, true).run();
                      } catch (Exception e) {
                          showMikaelInstallError("Falha ao preparar " + loader + " para Minecraft " + gameVersion + ".", e);
                      }
                  });
              }
          
              private void startMikaelForgeInstall(String gameVersion, boolean combineWithOptiFine) {
                  showMikaelInstallProgress(combineWithOptiFine
                          ? "Baixando Forge compatível. Depois o OptiFine será preparado para essa instalação..."
                          : "Procurando e baixando a versão do Forge compatível com Minecraft " + gameVersion + "...");
                  PojavApplication.sExecutorService.execute(() -> {
                      try {
                          List<String> available = ForgeUtils.downloadForgeVersions();
                          String prefix = gameVersion + "-";
                          String selected = null;
                          if (available != null) {
                              for (String candidate : available) {
                                  if (candidate != null && candidate.startsWith(prefix)) selected = candidate;
                              }
                          }
                          if (selected == null) {
                              showMikaelInstallError("O Forge não tem um instalador compatível com Minecraft "
                                      + gameVersion + ".", null);
                              return;
                          }
                          new ForgeDownloadTask(
                                  createMikaelNativeInstallerListener("Forge", gameVersion, combineWithOptiFine),
                                  selected).run();
                      } catch (Exception e) {
                          showMikaelInstallError("Não foi possível obter as versões do Forge.", e);
                      }
                  });
              }
          
              private void startMikaelNeoForgeInstall(String gameVersion) {
                  showMikaelInstallProgress("Procurando e baixando o NeoForge compatível com Minecraft " + gameVersion + "...");
                  PojavApplication.sExecutorService.execute(() -> {
                      try {
                          List<String> available = net.kdt.pojavlaunch.fragments.NeoForgeInstallFragment.downloadNeoForgeVersions();
                          String[] parts = gameVersion.split("\\.");
                          String family = null;
                          if (parts.length >= 2 && "1".equals(parts[0])) {
                              family = parts[1] + "." + (parts.length >= 3 ? parts[2] : "0") + ".";
                          }
                          String selected = null;
                          if (available != null) {
                              for (String candidate : available) {
                                  if (candidate == null) continue;
                                  if (candidate.startsWith(gameVersion + "-")
                                          || (family != null && candidate.startsWith(family))) {
                                      selected = candidate;
                                  }
                              }
                          }
                          if (selected == null) {
                              showMikaelInstallError("O NeoForge não tem uma versão compatível com Minecraft "
                                      + gameVersion + ".", null);
                              return;
                          }
                          new NeoForgeDownloadTask(
                                  createMikaelNativeInstallerListener("NeoForge", gameVersion, false),
                                  selected).run();
                      } catch (Exception e) {
                          showMikaelInstallError("Não foi possível obter as versões do NeoForge.", e);
                      }
                  });
              }
          
              private OptiFineUtils.OptiFineVersion findMikaelOptiFineVersion(String gameVersion) throws java.io.IOException {
                  OptiFineUtils.OptiFineVersions all = OptiFineUtils.downloadOptiFineVersions();
                  if (all == null || all.minecraftVersions == null || all.optifineVersions == null) return null;
                  int count = Math.min(all.minecraftVersions.size(), all.optifineVersions.size());
                  for (int i = 0; i < count; i++) {
                      if (!gameVersion.equals(all.minecraftVersions.get(i))) continue;
                      List<OptiFineUtils.OptiFineVersion> versions = all.optifineVersions.get(i);
                      if (versions != null && !versions.isEmpty()) return versions.get(0);
                  }
                  return null;
              }
          
              private void startMikaelOptiFineInstall(String gameVersion) {
                  showMikaelInstallProgress("Procurando e baixando o OptiFine compatível com Minecraft " + gameVersion + "...");
                  PojavApplication.sExecutorService.execute(() -> {
                      try {
                          OptiFineUtils.OptiFineVersion selected = findMikaelOptiFineVersion(gameVersion);
                          if (selected == null) {
                              showMikaelInstallError("O OptiFine não tem uma versão compatível com Minecraft "
                                      + gameVersion + ".", null);
                              return;
                          }
                          new OptiFineDownloadTask(selected,
                                  createMikaelNativeInstallerListener("OptiFine", gameVersion, false), this).run();
                      } catch (Exception e) {
                          showMikaelInstallError("Não foi possível baixar o OptiFine.", e);
                      }
                  });
              }
          
              private ModloaderDownloadListener createMikaelNativeInstallerListener(
                      final String loader, final String gameVersion, final boolean combineWithOptiFine) {
                  return new ModloaderDownloadListener() {
                      @Override
                      public void onDownloadFinished(File downloadedFile) {
                          runOnUiThread(() -> {
                              if (downloadedFile == null || !downloadedFile.isFile() || downloadedFile.length() <= 0) {
                                  showMikaelInstallError("O instalador baixado para " + loader + " está vazio ou ausente.", null);
                                  return;
                              }
                              boolean combined = "Forge".equals(loader) && combineWithOptiFine;
                              getSharedPreferences("mikael_launcher_plus", MODE_PRIVATE).edit()
                                      .putBoolean("pending_native_installer", !combined)
                                      .putString("pending_native_loader", loader)
                                      .putString("pending_game_version", gameVersion)
                                      .putBoolean("pending_optifine_after_forge", combined)
                                      .apply();
                              dismissMikaelInstallProgressInternal();
                              Intent installer = new Intent(LauncherActivity.this, JavaGUILauncherActivity.class);
                              if ("Forge".equals(loader)) {
                                  ForgeUtils.addAutoInstallArgs(installer, downloadedFile, true);
                              } else if ("OptiFine".equals(loader)) {
                                  OptiFineUtils.addAutoInstallArgs(installer, downloadedFile);
                              } else if ("NeoForge".equals(loader)) {
                                  installer.putExtra("javaArgs", "-jar \"" + downloadedFile.getAbsolutePath() + "\" --install-client")
                                          .putExtra("openLogOutput", true);
                              } else {
                                  showMikaelInstallError("Não existe um instalador integrado para " + loader + ".", null);
                                  return;
                              }
                              startActivity(installer);
                          });
                      }
                      @Override
                      public void onDataNotAvailable() {
                          showMikaelInstallError("Não há um instalador compatível de " + loader
                                  + " para Minecraft " + gameVersion + ".", null);
                      }
                      @Override
                      public void onDownloadError(Exception e) {
                          showMikaelInstallError("Falha ao baixar o instalador de " + loader + ".", e);
                      }
                  };
              }
          
              private void finishMikaelProfileInstall(String loader, String gameVersion) {
                  try {
                      LauncherProfiles.load();
                      String profileKey = findMikaelInstalledProfile(loader, gameVersion);
                      if (profileKey == null) {
                          showMikaelInstallError(loader + " foi baixado, mas o perfil instalado não foi encontrado.", null);
                          return;
                      }
                      LauncherPreferences.DEFAULT_PREF.edit()
                              .putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, profileKey).apply();
                      LauncherProfiles.write();
                      dismissMikaelInstallProgress();
                      new Handler(Looper.getMainLooper()).postDelayed(
                              () -> ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true), 800);
                  } catch (Exception e) {
                      showMikaelInstallError("Não foi possível selecionar a instalação de " + loader + ".", e);
                  }
              }
          
              private void startMikaelOptiFineAfterForge(String gameVersion) {
                  showMikaelInstallProgress("Forge instalado. Baixando o OptiFine compatível para adicionar à instância...");
                  PojavApplication.sExecutorService.execute(() -> {
                      try {
                          OptiFineUtils.OptiFineVersion selected = findMikaelOptiFineVersion(gameVersion);
                          if (selected == null) {
                              showMikaelInstallError("Forge foi instalado, mas não existe OptiFine listado para Minecraft "
                                      + gameVersion + ".", null);
                              return;
                          }
                          ModloaderDownloadListener listener = new ModloaderDownloadListener() {
                              @Override
                              public void onDownloadFinished(File downloadedFile) {
                                  runOnUiThread(() -> installMikaelOptiFineIntoForge(downloadedFile, gameVersion));
                              }
                              @Override
                              public void onDataNotAvailable() {
                                  showMikaelInstallError("Não foi possível obter um OptiFine compatível.", null);
                              }
                              @Override
                              public void onDownloadError(Exception e) {
                                  showMikaelInstallError("Falha ao baixar o OptiFine para Forge.", e);
                              }
                          };
                          new OptiFineDownloadTask(selected, listener, this).run();
                      } catch (Exception e) {
                          showMikaelInstallError("Não foi possível preparar OptiFine para Forge.", e);
                      }
                  });
              }
          
              private void installMikaelOptiFineIntoForge(File sourceJar, String gameVersion) {
                  try {
                      if (sourceJar == null || !sourceJar.isFile() || sourceJar.length() <= 0
                              || sourceJar.length() > 64L * 1024L * 1024L) {
                          throw new java.io.IOException("O arquivo do OptiFine está vazio ou excede 64 MiB.");
                      }
                      LauncherProfiles.load();
                      String forgeKey = findMikaelInstalledProfile("Forge", gameVersion);
                      if (forgeKey == null) throw new java.io.IOException("O perfil Forge não foi encontrado.");
                      MinecraftProfile profile = LauncherProfiles.mainProfileJson.profiles.get(forgeKey);
                      if (profile == null) throw new java.io.IOException("Os dados do perfil Forge estão inválidos.");
                      File gameDir = Tools.getGameDirPath(profile);
                      if (gameDir == null) throw new java.io.IOException("A pasta de jogo do perfil Forge não está disponível.");
                      File modsDir = new File(gameDir, "mods");
                      if (!modsDir.isDirectory() && !modsDir.mkdirs()) {
                          throw new java.io.IOException("Não foi possível criar a pasta mods do perfil Forge.");
                      }
                      String safeVersion = gameVersion.replaceAll("[^A-Za-z0-9._-]", "_");
                      File target = new File(modsDir, "OptiFine-" + safeVersion + ".jar");
                      File part = new File(modsDir, target.getName() + ".part");
                      File backup = new File(modsDir, target.getName() + ".bak");
                      if (part.exists() && !part.delete()) throw new java.io.IOException("Não foi possível limpar o temporário anterior.");
                      long copied = 0L;
                      try (FileInputStream input = new FileInputStream(sourceJar);
                           FileOutputStream output = new FileOutputStream(part)) {
                          byte[] buffer = new byte[8192];
                          int count;
                          while ((count = input.read(buffer)) != -1) {
                              copied += count;
                              if (copied > 64L * 1024L * 1024L) {
                                  throw new java.io.IOException("O arquivo do OptiFine excedeu 64 MiB.");
                              }
                              output.write(buffer, 0, count);
                          }
                          output.flush();
                          output.getFD().sync();
                      }
                      if (copied != sourceJar.length()) throw new java.io.IOException("A cópia do OptiFine ficou incompleta.");
                      if (backup.exists() && !backup.delete()) throw new java.io.IOException("Não foi possível remover o backup antigo.");
                      if (target.exists() && !target.renameTo(backup)) throw new java.io.IOException("Não foi possível guardar o arquivo antigo.");
                      if (!part.renameTo(target)) {
                          if (backup.exists()) backup.renameTo(target);
                          throw new java.io.IOException("Não foi possível concluir a instalação do OptiFine.");
                      }
                      if (backup.exists()) backup.delete();
                      LauncherPreferences.DEFAULT_PREF.edit()
                              .putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, forgeKey).apply();
                      LauncherProfiles.write();
                      dismissMikaelInstallProgress();
                      new Handler(Looper.getMainLooper()).postDelayed(
                              () -> ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true), 800);
                  } catch (Exception e) {
                      showMikaelInstallError("Não foi possível adicionar OptiFine à pasta mods do perfil Forge.", e);
                  }
              }
          
              private String findMikaelInstalledProfile(String loader, String gameVersion) {
                  if (gameVersion == null || LauncherProfiles.mainProfileJson == null
                          || LauncherProfiles.mainProfileJson.profiles == null) return null;
                  String base = gameVersion.toLowerCase(java.util.Locale.ROOT);
                  String neoForgeFamily = "";
                  String[] parts = gameVersion.split("\\\\.");
                  if (parts.length >= 2 && "1".equals(parts[0])) {
                      neoForgeFamily = parts[1] + "." + (parts.length >= 3 ? parts[2] : "0") + ".";
                  }
                  for (String key : LauncherProfiles.mainProfileJson.profiles.keySet()) {
                      MinecraftProfile profile = LauncherProfiles.mainProfileJson.profiles.get(key);
                      if (profile == null || profile.lastVersionId == null) continue;
                      String id = profile.lastVersionId;
                      String lower = id.toLowerCase(java.util.Locale.ROOT);
                      boolean match = false;
                      if ("Forge".equals(loader)) {
                          match = lower.startsWith(base + "-forge-") || lower.startsWith("forge-" + base);
                      } else if ("Fabric".equals(loader)) {
                          match = lower.startsWith("fabric-loader-") && lower.endsWith("-" + base);
                      } else if ("Quilt".equals(loader)) {
                          match = lower.startsWith("quilt-loader-") && lower.endsWith("-" + base);
                      } else if ("NeoForge".equals(loader)) {
                          match = (lower.startsWith(base + "-neoforge-") || lower.startsWith("neoforge-" + base))
                                  || (!neoForgeFamily.isEmpty() && lower.startsWith("neoforge-" + neoForgeFamily));
                      } else if ("OptiFine".equals(loader)) {
                          match = lower.startsWith(base) && (lower.contains("optifine") || lower.contains("hd_u"));
                      }
                      if (match) return key;
                  }
                  return null;
              }
          
              private void maybeResumeMikaelPendingInstaller() {
                  if (mikaelPendingInstallResumeScheduled || isFinishing()) return;
                  android.content.SharedPreferences initial = getSharedPreferences("mikael_launcher_plus", MODE_PRIVATE);
                  if (!initial.getBoolean("pending_native_installer", false)
                          && !initial.getBoolean("pending_optifine_after_forge", false)) {
                      mikaelPendingInstallAttempts = 0;
                      return;
                  }
                  mikaelPendingInstallResumeScheduled = true;
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      mikaelPendingInstallResumeScheduled = false;
                      if (isFinishing()) return;
                      android.content.SharedPreferences prefs = getSharedPreferences("mikael_launcher_plus", MODE_PRIVATE);
                      boolean pendingForgeCombo = prefs.getBoolean("pending_optifine_after_forge", false);
                      boolean pendingInstaller = prefs.getBoolean("pending_native_installer", false);
                      if (!pendingForgeCombo && !pendingInstaller) return;
                      String gameVersion = prefs.getString("pending_game_version", "");
                      if (gameVersion == null || !gameVersion.matches("[A-Za-z0-9._-]{1,100}")) {
                          prefs.edit().remove("pending_optifine_after_forge").remove("pending_native_installer")
                                  .remove("pending_native_loader").remove("pending_game_version").apply();
                          showMikaelInstallError("Não foi possível identificar a versão que acabou de ser instalada.", null);
                          return;
                      }
                      try { LauncherProfiles.load(); } catch (Exception ignored) { }
                      if (LauncherProfiles.mainProfileJson == null
                              || LauncherProfiles.mainProfileJson.profiles == null
                              || LauncherProfiles.mainProfileJson.profiles.isEmpty()) {
                          retryOrStopMikaelPendingInstaller(prefs);
                          return;
                      }
                      if (pendingForgeCombo) {
                          String forgeProfile = findMikaelInstalledProfile("Forge", gameVersion);
                          if (forgeProfile == null) {
                              retryOrStopMikaelPendingInstaller(prefs);
                              return;
                          }
                          prefs.edit().remove("pending_optifine_after_forge").remove("pending_native_installer")
                                  .remove("pending_native_loader").remove("pending_game_version").apply();
                          mikaelPendingInstallAttempts = 0;
                          startMikaelOptiFineAfterForge(gameVersion);
                          return;
                      }
                      String loader = prefs.getString("pending_native_loader", "");
                      String profileKey = findMikaelInstalledProfile(loader, gameVersion);
                      if (profileKey == null) {
                          retryOrStopMikaelPendingInstaller(prefs);
                          return;
                      }
                      LauncherPreferences.DEFAULT_PREF.edit()
                              .putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, profileKey).apply();
                      LauncherProfiles.write();
                      prefs.edit().remove("pending_native_installer").remove("pending_native_loader")
                              .remove("pending_optifine_after_forge").remove("pending_game_version").apply();
                      mikaelPendingInstallAttempts = 0;
                      dismissMikaelInstallProgress();
                      new Handler(Looper.getMainLooper()).postDelayed(
                              () -> ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true), 800);
                  }, 900);
              }
          
              private void retryOrStopMikaelPendingInstaller(android.content.SharedPreferences prefs) {
                  if (++mikaelPendingInstallAttempts < 20) {
                      maybeResumeMikaelPendingInstaller();
                      return;
                  }
                  prefs.edit().remove("pending_native_installer").remove("pending_native_loader")
                          .remove("pending_optifine_after_forge").remove("pending_game_version").apply();
                  mikaelPendingInstallAttempts = 0;
                  showMikaelInstallError("O instalador terminou, mas não foi possível localizar o perfil criado. Confira o log de instalação.", null);
              }
