                                  String id = candidate.lastVersionId.toLowerCase(java.util.Locale.ROOT);
                                  String base = gameVersion.toLowerCase(java.util.Locale.ROOT);
                                  if (id.startsWith(base + "-forge-") || id.startsWith("forge-" + base)) {
