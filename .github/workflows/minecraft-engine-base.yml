                          File part = new File(modsDir, target.getName() + ".part");
                          File backup = new File(modsDir, target.getName() + ".bak");
                          if (part.exists() && !part.delete()) throw new IOException("Não foi possível limpar o arquivo temporário anterior.");
                          long copied = 0;
