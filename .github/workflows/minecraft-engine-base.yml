      - name: Validate integrated Java source without packaging APK
        if: github.event_name == 'push' || inputs.mode == 'validate'
        working-directory: upstream/Amethyst-Android
        run: ./gradlew --no-daemon --stacktrace :app_pojavlauncher:compileDebugJavaWithJavac

      - name: Build upstream Android launcher (APK generation authorized only by explicit mode)
        if: inputs.mode == 'build'
        working-directory: upstream/Amethyst-Android
        run: ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Upload APK and build provenance
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: mikael-launcher-plus-engine-test-debug
          path: |
            upstream/Amethyst-Android/app_pojavlauncher/build/outputs/apk/debug/*.apk
            upstream-commit.txt
            upstream/Amethyst-Android/LICENSE
            upstream/Amethyst-Android/.gitmodules
          if-no-files-found: error
          retention-days: 14
