name: Minecraft engine base (Amethyst)

on:
  # Source changes validate the real engine integration; this never packages an APK.
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/mikael/launcherplus/**'
      - '.github/workflows/minecraft-engine-base.yml'
  # Manual validation is the default. APK packaging requires explicitly selecting "build".
  workflow_dispatch:
    inputs:
      mode:
        description: "Etapa: validar a integração sem APK ou compilar APK (somente quando autorizado)"
        required: true
        type: choice
        options:
          - validate
          - build
        default: validate

permissions:
  contents: read

concurrency:
  group: engine-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engine-base:
    name: Build pinned Amethyst Android engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Mikael Launcher Plus
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          test -n "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Configure HTTPS for upstream submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Fetch upstream source at pinned revision
        run: |
          git clone --no-checkout https://github.com/AngelAuraMC/Amethyst-Android.git upstream/Amethyst-Android
          git -C upstream/Amethyst-Android checkout --detach 330c6eae3164df64bdc4828e946a9e62cc5169e4
          git -C upstream/Amethyst-Android submodule sync --recursive
          git -C upstream/Amethyst-Android submodule update --init --recursive
          git -C upstream/Amethyst-Android rev-parse HEAD | tee upstream-commit.txt
          test "$(cat upstream-commit.txt)" = "330c6eae3164df64bdc4828e946a9e62cc5169e4"

      - name: Adapt compile SDK to currently published Android platform
        working-directory: upstream/Amethyst-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app_pojavlauncher/build.gradle")
          content = path.read_text()
          if "compileSdk = 37" not in content:
              raise SystemExit("Expected pinned upstream compileSdk declaration was not found")
          replacement = """compileSdk {
              version = release(36) {
                  it.minorApiLevel = 1
              }
          }"""
          path.write_text(content.replace("compileSdk = 37", replacement, 1))
          PY

      - name: Apply development app label
        working-directory: upstream/Amethyst-Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app_pojavlauncher/build.gradle")
          content = path.read_text()
          replacements = {
              'resValue "string", "app_name", "Amethyst (Debug)"':
                  'resValue "string", "app_name", "Mikael Launcher Plus (Engine Test)"',
              'resValue "string", "app_short_name", "Amethyst (Debug)"':
                  'resValue "string", "app_short_name", "Mikael Launcher Plus"',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit("Expected debug app label not found: " + old)
              content = content.replace(old, new, 1)
          path.write_text(content)
          PY

      - name: Integrate Mikael UI and instance tools into the engine app
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/app/src/main/java/com/mikael/launcherplus"
          destination_dir="$GITHUB_WORKSPACE/upstream/Amethyst-Android/app_pojavlauncher/src/main/java/com/mikael/launcherplus"
          test -f "$source_dir/MainActivity.java"
          test -f "$source_dir/InstanceManager.java"
          test -f "$source_dir/InstanceModManager.java"
          test -f "$source_dir/VersionArtifactInstaller.java"
          test -f "$source_dir/MinecraftEngineBridge.java"
          test -f "$source_dir/ModCompatibilityChecker.java"
          test -f "$source_dir/DiagnosticLogManager.java"
          test -f "$source_dir/InstanceReadinessChecker.java"
          test -f "$source_dir/VanillaAssetInstaller.java"
          test -f "$source_dir/VanillaLibraryInstaller.java"
          mkdir -p "$destination_dir"
          cp "$source_dir/MainActivity.java" "$source_dir/InstanceManager.java" \
             "$source_dir/InstanceModManager.java" "$source_dir/VersionArtifactInstaller.java" \
             "$source_dir/MinecraftEngineBridge.java" "$source_dir/ModCompatibilityChecker.java" \
             "$source_dir/DiagnosticLogManager.java" "$source_dir/InstanceReadinessChecker.java" \
             "$source_dir/VanillaAssetInstaller.java" "$source_dir/VanillaLibraryInstaller.java" "$destination_dir/"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/AndroidManifest.xml")
          content = path.read_text()
          if 'android:name="com.mikael.launcherplus.MainActivity"' in content:
              raise SystemExit("Mikael launcher activity already exists; refusing to duplicate it")

          blocks = list(re.finditer(r'        <activity\b.*?</activity>', content, re.DOTALL))
          matches = []
          for block in blocks:
              value = block.group(0)
              if ('android:name=".TestStorageActivity"' in value
                      and 'android.intent.action.MAIN' in value
                      and 'android.intent.category.LAUNCHER' in value):
                  matches.append(block)
          if len(matches) != 1:
              raise SystemExit("Expected exactly one TestStorageActivity launcher block; found " + str(len(matches)))

          launcher_block = """        <activity
                      android:name=".TestStorageActivity"
                      android:exported="false"
                      android:label="@string/app_short_name"
                      android:launchMode="singleTop" />
                  <activity
                      android:name="com.mikael.launcherplus.MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>"""
          block = matches[0]
          path.write_text(content[:block.start()] + launcher_block + content[block.end():])
          PY
          grep -q 'android:name="com.mikael.launcherplus.MainActivity"' \
            upstream/Amethyst-Android/app_pojavlauncher/src/main/AndroidManifest.xml

          # Forward the selected version through the engine's required storage bootstrap.
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch")
          extra = "com.mikael.launcherplus.extra.REQUESTED_VERSION"
          loader_extra = "com.mikael.launcherplus.extra.REQUESTED_LOADER"

          bootstrap = root / "TestStorageActivity.java"
          text = bootstrap.read_text()
          old = "Intent intent =  new Intent(this, LauncherActivity.class);"
          new = (
              "Intent intent = new Intent(this, LauncherActivity.class);\n"
              "        String requestedVersion = getIntent().getStringExtra(\"" + extra + "\");\n"
              "        if (requestedVersion != null && requestedVersion.matches(\"[A-Za-z0-9._-]{1,100}\")) {\n"
              "            intent.putExtra(\"" + extra + "\", requestedVersion);\n"
              "        }\n"
              "        String requestedLoader = getIntent().getStringExtra(\"" + loader_extra + "\");\n"
              "        if (\"Vanilla\".equals(requestedLoader) || \"Forge\".equals(requestedLoader) || \"Fabric\".equals(requestedLoader) || \"Quilt\".equals(requestedLoader) || \"NeoForge\".equals(requestedLoader) || \"OptiFine\".equals(requestedLoader) || \"Forge + OptiFine\".equals(requestedLoader)) {\n"
              "            intent.putExtra(\"" + loader_extra + "\", requestedLoader);\n"
              "        }"
          )
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one TestStorageActivity launcher handoff")
          bootstrap.write_text(text.replace(old, new, 1))

          launcher = root / "LauncherActivity.java"
          text = launcher.read_text()
          text = text.replace(
              "import android.os.Bundle;\n",
              "import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n",
              1
          )
          field_anchor = "    private mcAccountSpinner mAccountSpinner;"
          fields = (
              "    private String mikaelRequestedVersion;\n"
              "    private String mikaelRequestedLoader;\n"
              "    private boolean mikaelLaunchScheduled;\n"
              "    private int mikaelLaunchAttempts;\n"
              "    private boolean mikaelLoaderNavigationScheduled;\n"
              "    private int mikaelLoaderNavigationAttempts;\n"
              "    private boolean mikaelPendingInstallResumeScheduled;\n"
              "    private int mikaelPendingInstallAttempts;\n"
              + field_anchor
          )
          if text.count(field_anchor) != 1:
              raise SystemExit("Expected exactly one launcher account-spinner field")
          text = text.replace(field_anchor, fields, 1)

          on_create = (
              "        super.onCreate(savedInstanceState);\n"
              "        setContentView(R.layout.activity_pojav_launcher);"
          )
          on_create_replacement = (
              "        super.onCreate(savedInstanceState);\n"
              "        mikaelRequestedVersion = getIntent().getStringExtra(\"" + extra + "\");\n"
              "        mikaelRequestedLoader = getIntent().getStringExtra(\"" + loader_extra + "\");\n"
              "        setContentView(R.layout.activity_pojav_launcher);"
          )
          if text.count(on_create) != 1:
              raise SystemExit("Expected exactly one LauncherActivity onCreate setup")
          text = text.replace(on_create, on_create_replacement, 1)

          resume = (
              "    protected void onResume() {\n"
              "        super.onResume();\n"
              "        ContextExecutor.setActivity(this);\n"
              "        mInstallTracker.attach();\n"
              "    }"
          )
          resume_replacement = (
              "    protected void onResume() {\n"
              "        super.onResume();\n"
              "        ContextExecutor.setActivity(this);\n"
              "        mInstallTracker.attach();\n"
              "        maybeOpenMikaelRequestedLoaderInstaller();\n"
              "        maybeResumeMikaelPendingInstaller();\n"
              "        maybeLaunchMikaelRequestedVersion();\n"
              "    }"
          )
          if text.count(resume) != 1:
              raise SystemExit("Expected exactly one LauncherActivity onResume")
          text = text.replace(resume, resume_replacement, 1)

          method_anchor = "    @Override\n    protected void onResume() {"
          method = (
              "    private void maybeLaunchMikaelRequestedVersion() {\n"
              "        if (mikaelRequestedVersion == null || mikaelLaunchScheduled) return;\n"
              "        mikaelLaunchScheduled = true;\n"
              "        new Handler(Looper.getMainLooper()).postDelayed(() -> {\n"
              "            mikaelLaunchScheduled = false;\n"
              "            if (mikaelRequestedVersion == null || isFinishing()) return;\n"
              "            if (LauncherProfiles.mainProfileJson == null\n"
              "                    || LauncherProfiles.mainProfileJson.profiles == null\n"
              "                    || LauncherProfiles.mainProfileJson.profiles.isEmpty()) {\n"
              "                if (++mikaelLaunchAttempts < 20) {\n"
              "                    maybeLaunchMikaelRequestedVersion();\n"
              "                } else {\n"
              "                    Toast.makeText(this, \"O perfil do Minecraft ainda não está pronto. Abra o menu e tente novamente.\", Toast.LENGTH_LONG).show();\n"
              "                    mikaelRequestedVersion = null;\n"
              "                    getIntent().removeExtra(\"" + extra + "\");\n"
              "                }\n"
              "                return;\n"
              "            }\n"
              "            String selectedProfile = LauncherPreferences.DEFAULT_PREF.getString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, \"\");\n"
              "            if (!LauncherProfiles.mainProfileJson.profiles.containsKey(selectedProfile)) {\n"
              "                selectedProfile = LauncherProfiles.mainProfileJson.profiles.keySet().iterator().next();\n"
              "                LauncherPreferences.DEFAULT_PREF.edit().putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, selectedProfile).apply();\n"
              "            }\n"
              "            MinecraftProfile profile = LauncherProfiles.mainProfileJson.profiles.get(selectedProfile);\n"
              "            if (profile == null) {\n"
              "                Toast.makeText(this, \"Não foi possível selecionar o perfil do Minecraft.\", Toast.LENGTH_LONG).show();\n"
              "                mikaelRequestedVersion = null;\n"
              "                getIntent().removeExtra(\"" + extra + "\");\n"
              "                return;\n"
              "            }\n"
              "            profile.lastVersionId = mikaelRequestedVersion;\n"
              "            LauncherProfiles.mainProfileJson.profiles.put(selectedProfile, profile);\n"
              "            LauncherProfiles.write();\n"
              "            mikaelRequestedVersion = null;\n"
              "            getIntent().removeExtra(\"" + extra + "\");\n"
              "            ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true);\n"
              "        }, 900);\n"
              "    }\n\n"
              + method_anchor
          )
          if text.count(method_anchor) != 1:
              raise SystemExit("Expected exactly one LauncherActivity lifecycle insertion point")
          text = text.replace(method_anchor, method, 1)
          launcher.write_text(text)
          PY

      - name: Connect selected modloaders to native installers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          root = Path("upstream/Amethyst-Android/app_pojavlauncher/src/main/java/net/kdt/pojavlaunch")
          
          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(label + ": expected 1 match, found " + str(count))
              return source.replace(old, new, 1)
          
          def add_imports(source, imports):
              line_end = source.find("\n")
              if line_end < 0:
                  raise SystemExit("Missing package declaration")
              insert_at = line_end + 1
              missing = [item for item in imports if item not in source]
              if missing:
                  source = source[:insert_at] + "\n" + "\n".join(missing) + "\n" + source[insert_at:]
              return source
          
          # Route selected loaders into the engine's real, already-existing installer screens.
          launcher_path = root / "LauncherActivity.java"
          launcher = launcher_path.read_text()
          guard_old = '        if (mikaelRequestedVersion == null || mikaelLaunchScheduled) return;\n'
          guard_new = '        if (mikaelRequestedLoader != null && !"Vanilla".equals(mikaelRequestedLoader)) return;\n' + guard_old
          launcher = replace_once(launcher, guard_old, guard_new, "prevent vanilla launch while a loader is selected")
          method_anchor = "    private void maybeLaunchMikaelRequestedVersion() {"
          routing_methods = r'''    private void maybeOpenMikaelRequestedLoaderInstaller() {
                  if (mikaelRequestedLoader == null || mikaelLoaderNavigationScheduled || isFinishing()) return;
                  if ("Vanilla".equals(mikaelRequestedLoader)) {
                      mikaelRequestedLoader = null;
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                      return;
                  }
                  mikaelLoaderNavigationScheduled = true;
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      mikaelLoaderNavigationScheduled = false;
                      if (mikaelRequestedLoader == null || isFinishing()) return;
                      if (LauncherProfiles.mainProfileJson == null
                              || LauncherProfiles.mainProfileJson.profiles == null
                              || LauncherProfiles.mainProfileJson.profiles.isEmpty()) {
                          if (++mikaelLoaderNavigationAttempts < 20) {
                              maybeOpenMikaelRequestedLoaderInstaller();
                          } else {
                              mikaelRequestedLoader = null;
                              mikaelRequestedVersion = null;
                              getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                              getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_VERSION");
                              Toast.makeText(this, "O perfil do Minecraft não ficou pronto. Abra o motor e tente novamente.", Toast.LENGTH_LONG).show();
                          }
                          return;
                      }
                      String loader = mikaelRequestedLoader;
                      String gameVersion = mikaelRequestedVersion;
                      if (gameVersion == null || !gameVersion.matches("[A-Za-z0-9._-]{1,100}")) {
                          mikaelRequestedLoader = null;
                          mikaelRequestedVersion = null;
                          getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                          getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_VERSION");
                          Toast.makeText(this, "A versão do Minecraft selecionada é inválida.", Toast.LENGTH_LONG).show();
                          return;
                      }
          
                      Bundle args = new Bundle();
                      args.putString("mikael_requested_game_version", gameVersion);
                      boolean combine = "Forge + OptiFine".equals(loader);
                      args.putBoolean("mikael_combine_forge_optifine", combine);
                      mikaelRequestedLoader = null;
                      mikaelRequestedVersion = null;
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_LOADER");
                      getIntent().removeExtra("com.mikael.launcherplus.extra.REQUESTED_VERSION");
          
                      if ("Forge".equals(loader) || combine) {
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.ForgeInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.ForgeInstallFragment.TAG, args);
                      } else if ("Fabric".equals(loader)) {
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.FabricInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.FabricInstallFragment.TAG, args);
                      } else if ("Quilt".equals(loader)) {
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.QuiltInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.QuiltInstallFragment.TAG, args);
                      } else if ("NeoForge".equals(loader)) {
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.NeoForgeInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.NeoForgeInstallFragment.TAG, args);
                      } else if ("OptiFine".equals(loader)) {
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.OptiFineInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.OptiFineInstallFragment.TAG, args);
                      } else {
                          Toast.makeText(this, "Este modloader não possui um instalador integrado.", Toast.LENGTH_LONG).show();
                      }
                  }, 700);
              }
          
              private String findMikaelInstalledProfile(String loader, String gameVersion) {
                  if (gameVersion == null || LauncherProfiles.mainProfileJson == null
                          || LauncherProfiles.mainProfileJson.profiles == null) return null;
                  String base = gameVersion.toLowerCase(java.util.Locale.ROOT);
                  String neoForgeFamily = "";
                  String[] parts = gameVersion.split("\\.");
                  if (parts.length >= 2 && "1".equals(parts[0])) {
                      neoForgeFamily = parts[1] + "." + (parts.length >= 3 ? parts[2] : "0") + ".";
                  }
                  for (String key : LauncherProfiles.mainProfileJson.profiles.keySet()) {
                      MinecraftProfile profile = LauncherProfiles.mainProfileJson.profiles.get(key);
                      if (profile == null || profile.lastVersionId == null) continue;
                      String id = profile.lastVersionId;
                      String lower = id.toLowerCase(java.util.Locale.ROOT);
                      boolean match = false;
                      if ("Forge".equals(loader)) {
                          match = lower.startsWith(base + "-forge-") || lower.startsWith("forge-" + base);
                      } else if ("Fabric".equals(loader)) {
                          match = lower.startsWith("fabric-loader-") && lower.endsWith("-" + base);
                      } else if ("Quilt".equals(loader)) {
                          match = lower.startsWith("quilt-loader-") && lower.endsWith("-" + base);
                      } else if ("NeoForge".equals(loader)) {
                          match = (lower.startsWith(base + "-neoforge-") || lower.startsWith("neoforge-" + base))
                                  || (!neoForgeFamily.isEmpty() && lower.startsWith("neoforge-" + neoForgeFamily));
                      } else if ("OptiFine".equals(loader)) {
                          match = lower.startsWith(base) && (lower.contains("optifine") || lower.contains("hd_u"));
                      }
                      if (match) return key;
                  }
                  return null;
              }
          
              private void maybeResumeMikaelPendingInstaller() {
                  if (mikaelPendingInstallResumeScheduled || isFinishing()) return;
                  android.content.SharedPreferences initial = getSharedPreferences("mikael_launcher_plus", MODE_PRIVATE);
                  if (!initial.getBoolean("pending_native_installer", false)
                          && !initial.getBoolean("pending_optifine_after_forge", false)) {
                      mikaelPendingInstallAttempts = 0;
                      return;
                  }
                  mikaelPendingInstallResumeScheduled = true;
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      mikaelPendingInstallResumeScheduled = false;
                      if (isFinishing()) return;
                      android.content.SharedPreferences prefs = getSharedPreferences("mikael_launcher_plus", MODE_PRIVATE);
                      boolean pendingForgeCombo = prefs.getBoolean("pending_optifine_after_forge", false);
                      boolean pendingInstaller = prefs.getBoolean("pending_native_installer", false);
                      if (!pendingForgeCombo && !pendingInstaller) return;
                      String gameVersion = prefs.getString("pending_game_version", "");
                      if (gameVersion == null || !gameVersion.matches("[A-Za-z0-9._-]{1,100}")) {
                          prefs.edit().remove("pending_optifine_after_forge").remove("pending_native_installer")
                                  .remove("pending_native_loader").remove("pending_game_version").apply();
                          Toast.makeText(this, "Não foi possível identificar a versão que acabou de ser instalada.", Toast.LENGTH_LONG).show();
                          return;
                      }
                      try {
                          LauncherProfiles.load();
                      } catch (Exception ignored) { }
                      if (LauncherProfiles.mainProfileJson == null
                              || LauncherProfiles.mainProfileJson.profiles == null
                              || LauncherProfiles.mainProfileJson.profiles.isEmpty()) {
                          retryOrStopMikaelPendingInstaller(prefs);
                          return;
                      }
                      if (pendingForgeCombo) {
                          String forgeProfile = findMikaelInstalledProfile("Forge", gameVersion);
                          if (forgeProfile == null) {
                              retryOrStopMikaelPendingInstaller(prefs);
                              return;
                          }
                          prefs.edit().remove("pending_optifine_after_forge").remove("pending_native_installer")
                                  .remove("pending_native_loader").remove("pending_game_version").apply();
                          Bundle args = new Bundle();
                          args.putString("mikael_requested_game_version", gameVersion);
                          args.putBoolean("mikael_combine_forge", true);
                          net.kdt.pojavlaunch.Tools.swapFragment(this,
                                  net.kdt.pojavlaunch.fragments.OptiFineInstallFragment.class,
                                  net.kdt.pojavlaunch.fragments.OptiFineInstallFragment.TAG, args);
                          mikaelPendingInstallAttempts = 0;
                          return;
                      }
                      String loader = prefs.getString("pending_native_loader", "");
                      String profileKey = findMikaelInstalledProfile(loader, gameVersion);
                      if (profileKey == null) {
                          retryOrStopMikaelPendingInstaller(prefs);
                          return;
                      }
                      LauncherPreferences.DEFAULT_PREF.edit()
                              .putString(LauncherPreferences.PREF_KEY_CURRENT_PROFILE, profileKey).apply();
                      LauncherProfiles.write();
                      prefs.edit().remove("pending_native_installer").remove("pending_native_loader")
                              .remove("pending_optifine_after_forge").remove("pending_game_version").apply();
                      mikaelPendingInstallAttempts = 0;
                      new Handler(Looper.getMainLooper()).postDelayed(
                              () -> ExtraCore.setValue(ExtraConstants.LAUNCH_GAME, true), 800);
                  }, 900);
              }
          
              private void retryOrStopMikaelPendingInstaller(android.content.SharedPreferences prefs) {
                  if (++mikaelPendingInstallAttempts < 20) {
                      maybeResumeMikaelPendingInstaller();
                      return;
                  }
                  prefs.edit().remove("pending_native_installer").remove("pending_native_loader")
                          .remove("pending_optifine_after_forge").remove("pending_game_version").apply();
                  mikaelPendingInstallAttempts = 0;
                  Toast.makeText(this, "O instalador terminou, mas não foi possível localizar o perfil criado. Confira o log do motor.", Toast.LENGTH_LONG).show();
              }
          
          '''
          launcher = replace_once(launcher, method_anchor, routing_methods + method_anchor, "insert native loader routing and installation resume")
          launcher_path.write_text(launcher)
          
          # Forge: only expose installer versions matching the selected Minecraft base and remember the native install hand-off.
          forge_path = root / "fragments/ForgeInstallFragment.java"
          forge = forge_path.read_text()
          forge = replace_once(forge,
          '''    public List<String> loadVersionList() throws IOException {
                  return ForgeUtils.downloadForgeVersions();
              }''',
          '''    public List<String> loadVersionList() throws IOException {
                  List<String> versions = ForgeUtils.downloadForgeVersions();
                  String requested = getArguments() == null ? null : getArguments().getString("mikael_requested_game_version");
                  if (requested == null || requested.trim().isEmpty() || versions == null) return versions;
                  List<String> filtered = new java.util.ArrayList<>();
                  String prefix = requested + "-";
                  for (String value : versions) {
                      if (value != null && value.startsWith(prefix)) filtered.add(value);
                  }
                  return filtered;
              }''', "filter Forge versions")
          forge = replace_once(forge,
